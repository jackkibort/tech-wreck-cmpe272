# Credentials Jenkins uses to read the GitHub repository and post commit statuses.
# Values come from Vault (secret/securehr/ci). /ci/scripts/fetch-ci-secrets.sh writes them to
# git-ignored files that Compose mounts under /run/secrets, where configuration as code reads
# each file as a variable named after it. Nothing secret is in this file or the image.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              description: "GitHub fine-grained token for the securehr repository (Vault secret/securehr/ci)"
              username: "${github_username}"
              password: "${github_token}"
