; Grafana settings for SecureHR. Values from Section 0.9 variables are read with $__env{...}.

[server]
domain = grafana.$__env{SECUREHR_DOMAIN}
root_url = https://grafana.$__env{SECUREHR_DOMAIN}/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
; Cookies only over HTTPS (the edge terminates TLS); no embedding in other sites.
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
disable_gravatar = true

[users]
allow_sign_up = false

; Keycloak is the only way in (Section 0.5). No local logins, no anonymous access.
[auth]
disable_login_form = true
oauth_auto_login = true
signout_redirect_url = $__env{KEYCLOAK_ISSUER_URI}/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.$__env{SECUREHR_DOMAIN}%2F

[auth.anonymous]
enabled = false

[auth.basic]
enabled = false

[auth.generic_oauth]
enabled = true
name = SecureHR SSO
client_id = grafana
client_secret = $__env{GRAFANA_OIDC_CLIENT_SECRET}
scopes = openid profile email
auth_url = $__env{KEYCLOAK_ISSUER_URI}/protocol/openid-connect/auth
token_url = $__env{KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token
api_url = $__env{KEYCLOAK_ISSUER_URI}/protocol/openid-connect/userinfo
use_pkce = true
login_attribute_path = preferred_username
email_attribute_path = email
name_attribute_path = name
; Grafana mapping (Section 0.5): SECUREHR_DEV is Grafana server admin; AUDITOR is Viewer, and
; the Platform folder is closed to Viewers (scripts/apply-folder-permissions.sh), so auditors
; see the Audit folder only. Anyone else maps to no role, and strict mode refuses the login.
role_attribute_path = contains(realm_access.roles[*], 'SECUREHR_DEV') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'AUDITOR') && 'Viewer'
role_attribute_strict = true
allow_assign_grafana_admin = true
skip_org_role_sync = false

[unified_alerting]
enabled = true
