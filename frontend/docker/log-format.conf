# Loaded at http level, before the server block (file name sorts first in conf.d).
log_format securehr_ui_json escape=json
    '{"timestamp":"$time_iso8601","service":"ui","log_type":"app",'
    '"request_id":"$http_x_request_id","method":"$request_method","resource":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time}';
