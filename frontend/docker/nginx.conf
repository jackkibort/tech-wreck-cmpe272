# Static web server for the portal (service "ui", Section 0.2). Reached only through the edge,
# which adds TLS, the firewall and the security headers; this server only serves files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # JSON access log on stdout (Section 0.10). No query strings, so OIDC codes are never logged.
    access_log /dev/stdout securehr_ui_json;

    # Hashed build assets never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime configuration and the app shell must always be fresh after a deploy.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/employees/10012, ...) load index.html and React routes them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
