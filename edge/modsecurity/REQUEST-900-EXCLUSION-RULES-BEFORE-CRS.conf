# SecureHR rule exceptions (Section 8.4). Loaded before the OWASP Core Rule Set.
#
# Every exception states what it changes and why. Keep this list short: each entry narrows what
# the firewall inspects. IDs 1000-1099 are reserved for SecureHR.

# 1000: Keycloak login form, "password" field only.
# Passwords are arbitrary strings chosen by users. Characters common in strong passwords (quotes,
# semicolons, "--") trip SQL injection rules, which would block a correct login and could count
# toward the account lockout. Keycloak never places the password in a query; it only checks it
# against the directory with an LDAP bind. Every other field of the form is still inspected, and
# password guessing is handled by the edge rate limit and Keycloak's lockout (Section 8.3).
SecRule REQUEST_FILENAME "@rx ^/realms/[^/]+/login-actions/" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password-new,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password-confirm"
